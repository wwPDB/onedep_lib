name: Run Pytest

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
        gemmi: ['0.7.4', '0.7.5']

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'
        cache-dependency-path: 'requirements_test.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements_test.txt ]; then pip install -r requirements_test.txt; fi
        pip install pytest "gemmi==${{ matrix.gemmi }}"

    - name: Run test suite with pytest
      run: |
        pytest
    - name: Verify installed wheel resources outside the checkout
      run: |
        pip wheel --no-deps . -w "$RUNNER_TEMP/onedep_wheels"
        pip install --force-reinstall --no-deps "$RUNNER_TEMP"/onedep_wheels/*.whl
        cd "$RUNNER_TEMP"
        python -c 'from onedep_lib.validation import MmCifValidator, ValidationOptions; engine = MmCifValidator.load([], options=ValidationOptions(phases=("cross",))); assert engine.rules.root_rule_count == 149'
